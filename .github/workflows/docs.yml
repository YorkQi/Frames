name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 文档一致性检查（含实际测试）
        shell: pwsh
        run: ./scripts/check-docs.ps1 -VerifyTests
